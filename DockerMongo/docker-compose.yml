services:
  web:
    build: . # Builds from a DockerFile that is in the directory our docker-compose.yml file is in
    command: python -u app.py
    ports:
      - "5001:5000"
    volumes:
      - .:/todo
    environment:
      - DB_PORT_27017_TCP_ADDR=db
    links:
      - db
  db:
    image: mongo:8.0
